{% extends 'theme.html' %}

{% block main %}
<div class="container py-4">
    <a href="{% url 'home' %}" class="btn btn-link px-0">&larr; Back to products</a>
    <div class="row g-4 align-items-start mt-2">
        <div class="col-md-6">
            {% if product.image %}
            <img src="{{ product.image.url }}" class="img-fluid rounded" alt="{{ product.name }}">
            {% endif %}
        </div>
        <div class="col-md-6">
            <h1>{{ product.name }}</h1>
            <p class="text-muted">{{ product.category.name }}</p>
            <p class="fs-4">Price: {{ product.price }}</p>
            <p>{{ product.desc }}</p>
            <form method="post" action="{% url 'add_to_cart' product.id %}" class="d-flex gap-2 align-items-end mt-4">
                {% csrf_token %}
                <div>
                    <label for="quantity" class="form-label">Quantity</label>
                    <input id="quantity" name="quantity" type="number" min="1" max="99" value="1" class="form-control" style="width: 6rem;">
                </div>
                <button type="submit" class="btn btn-dark">Add to cart</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
